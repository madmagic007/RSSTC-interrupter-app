; Common settings are inherited by every firmware environment.
[platformio]
default_envs = regular

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
upload_speed = 921600
upload_port = /dev/esp32c6
monitor_speed = 115200
monitor_port = /dev/esp32c6
monitor_echo = yes
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -O0
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
lib_deps = bblanchon/ArduinoJson@^7.2.2

[env:mains-ramped]
build_src_filter = +<mains-ramped.cpp>

[env:regular]
build_src_filter = +<regular.cpp>

[env:musical]
build_src_filter = +<musical.cpp>
